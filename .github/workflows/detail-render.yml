name: detail-render
# 상품 상세 이미지 — 상품·추천 자료가 바뀌어 푸시되면 크롬 헤드리스로 바뀐 상품만 다시 만들어 커밋 (2026-10-22)
# 클라우드 루틴(상품 늘리기·매일 개선)에 크롬이 없어도 상세 이미지가 빠지지 않게. 내용 지문이 같은 상품은 건너뛴다(src/detail-render.mjs).
on:
  push:
    branches: [main]
    paths: ['config/products.json', 'config/picks.json', 'config/guides.json', 'src/detail.mjs']
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: detail-render
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 2026-11-12 관제탑: 11/11 golf-price 3·techprice 1번이 러너 DNS 일시 장애(azure.archive.ubuntu.com 이름 찾기 실패)로 글꼴 설치에서 실패 →
      #   apt 재시도 옵션 + 30초 간격 3번 시도. 글꼴 없이 만들면 한글이 네모로 나오므로 3번 다 실패하면 그대로 실패시킨다.
      - name: 글꼴
        timeout-minutes: 8
        run: |
          A='-o Acquire::Retries=3 -o Acquire::http::Timeout=30'
          for i in 1 2 3; do
            sudo apt-get $A update -qq && sudo apt-get $A install -y -qq fonts-noto-cjk >/dev/null && fc-list :lang=ko family | grep -q 'Noto Sans CJK' && exit 0
            echo "::warning::글꼴 설치 실패 ${i}번째 — 30초 뒤 다시"; [ "$i" = 3 ] || sleep 30
          done
          echo '::error::글꼴 설치 3번 실패'; exit 1
      - name: 상세 이미지 만들기
        env:
          CHROME: /usr/bin/google-chrome
        run: DETAIL_DUMP=1 node src/build.mjs >/dev/null && node src/detail-render.mjs
      - name: 올리기
        run: |
          git config user.name unclepony; git config user.email unclepony77@gmail.com
          git add content/detail
          git diff --cached --quiet || git commit -q -m "상세 이미지 갱신 (GitHub Actions)"
          git pull -q --rebase --autostash && git push -q
