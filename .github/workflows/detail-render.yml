name: detail-render
# 상품 상세 이미지 — 상품·추천 자료가 바뀌어 푸시되면 크롬 헤드리스로 바뀐 상품만 다시 만들어 커밋 (2026-10-22)
# 클라우드 루틴(상품 늘리기·매일 개선)에 크롬이 없어도 상세 이미지가 빠지지 않게. 내용 지문이 같은 상품은 건너뛴다(src/detail-render.mjs).
on:
  push:
    branches: [main]
    paths: ['config/products.json', 'config/picks.json', 'config/guides.json', 'src/detail.mjs']
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: detail-render
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 글꼴
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk >/dev/null
      - name: 상세 이미지 만들기
        env:
          CHROME: /usr/bin/google-chrome
        run: DETAIL_DUMP=1 node src/build.mjs >/dev/null && node src/detail-render.mjs
      - name: 올리기
        run: |
          git config user.name unclepony; git config user.email unclepony77@gmail.com
          git add content/detail
          git diff --cached --quiet || git commit -q -m "상세 이미지 갱신 (GitHub Actions)"
          git pull -q --rebase && git push -q
