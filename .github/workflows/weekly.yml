# 매주 월요일 한국 시간 9시: 서치콘솔·클릭 자료 수집 → 가격 확인 목록 → Claude Code 자동 분석 → 빌드·링크 검사 통과 시 main 에 바로 반영 (실패하면 검토용 PR)
# 필요한 GitHub Secrets (없는 자료는 건너뛴다):
#   ANTHROPIC_API_KEY                      Claude Code 실행 (없으면 분석 단계를 건너뛰고 (a) 목록만 반영한다)
#   GSC_SERVICE_ACCOUNT, GSC_SITE          서치콘솔 (src/gsc-fetch.mjs)
#   CF_API_TOKEN, CF_ACCOUNT_ID, CF_D1_DATABASE_ID   클릭 추적 집계 (src/clicks-report.mjs)
# 검사 실패 때 PR 을 만들려면 저장소 설정 → Actions → General → 'Allow GitHub Actions to create and approve pull requests' 를 켠다.
name: weekly-analysis

on:
  schedule:
    - cron: '0 0 * * 1' # UTC 월 00:00 = 한국 시간 월 09:00
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SITE_URL: https://golf-price.pages.dev
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 빌드 (현재 제목·설명 읽기용)
        run: node src/build.mjs

      - name: 서치콘솔 지난 7일
        continue-on-error: true
        env:
          GSC_SERVICE_ACCOUNT: ${{ secrets.GSC_SERVICE_ACCOUNT }}
          GSC_SITE: ${{ secrets.GSC_SITE }}
        run: node src/gsc-fetch.mjs

      - name: 클릭 추적 지난 7일
        continue-on-error: true
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
        run: node src/clicks-report.mjs

      - name: 가격 확인 목록·분석 자료
        run: |
          node src/weekly-report.mjs
          node src/prices/template.mjs 20

      - name: Claude Code 주간 분석 (title/description 개선안, 본문·FAQ 초안 최대 2페이지)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then echo "ANTHROPIC_API_KEY 없음 — 분석 단계 건너뜀"; exit 0; fi
          npm install -g @anthropic-ai/claude-code
          claude -p "$(cat .github/prompts/weekly-analysis.md)" \
            --model sonnet \
            --max-turns 30 \
            --permission-mode acceptEdits \
            --allowedTools "Read" "Glob" "Grep" "Edit" "Write" "Bash(node src/build.mjs)" "Bash(node src/linkcheck.mjs)" \
            > claude-summary.txt
          cat claude-summary.txt

      - name: 검사 통과 시 main 에 바로 반영 (운영자 결정: 승인 없이 자동 반영)
        id: apply
        run: |
          DAY=$(TZ=Asia/Seoul date +%F)
          git config user.name "golf-price-bot"
          git config user.email "golf-price-bot@users.noreply.github.com"
          # 빌드가 관리하는 상태 파일은 매일 점검 작업이 갱신하므로 여기서는 넣지 않는다
          git checkout -- config/content-state.json config/url-manifest.json 2>/dev/null || true
          git add reports prices.csv config/howto.json
          if git diff --cached --quiet; then echo "바뀐 내용 없음"; echo "done=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          # 안전장치: 빌드(출시 형식·URL 301 보호 포함)와 링크 검사를 통과해야만 반영한다
          if node src/build.mjs && node src/linkcheck.mjs; then
            git checkout -- config/content-state.json config/url-manifest.json 2>/dev/null || true
            git commit -m "주간 분석 $DAY: 가격 확인 목록, title/description 개선안, 본문·FAQ 초안 (자동 반영)"
            git pull --rebase
            git push
            echo "done=1" >> "$GITHUB_OUTPUT"
          else
            echo "빌드 또는 링크 검사 실패 — main 에 반영하지 않고 검토용 PR 로 올립니다"
            git reset -q
          fi

      - name: 검사 실패 시에만 검토용 PR
        if: steps.apply.outputs.done != '1'
        run: |
          DAY=$(TZ=Asia/Seoul date +%F)
          BR="weekly/$DAY"
          git checkout -- config/content-state.json config/url-manifest.json 2>/dev/null || true
          git checkout -b "$BR"
          git add reports prices.csv config/howto.json
          git diff --cached --quiet && { echo "바뀐 내용 없음"; exit 0; }
          git commit -m "주간 분석 $DAY: 가격 확인 목록, title/description 개선안, 본문·FAQ 초안"
          git push -u origin "$BR"
          {
            echo "## 주간 분석 $DAY"
            echo
            echo "- (a) 이번 주 가격 확인할 상품 20개: \`reports/weekly/$DAY.md\`, \`prices.csv\` 에 줄 추가됨 (가격·확인일은 직접 채운 뒤 \`node src/prices/import.mjs\`)"
            echo "- (b) 노출 대비 클릭이 낮은 페이지 title/description 개선안: 보고서 (b) — 제안만, 코드는 바꾸지 않음"
            echo "- (c) 본문·FAQ 초안 최대 2페이지: \`config/howto.json\` (status: 초안 — 검토 필요, 불확실한 스펙은 TODO)"
            echo
            echo "빌드 또는 링크 검사를 통과하지 못해 자동 반영하지 않았습니다. 확인 후 병합하세요."
            echo
            [ -f claude-summary.txt ] && { echo "### Claude 요약"; echo; cat claude-summary.txt; }
            echo
            echo "🤖 Generated with [Claude Code](https://claude.com/claude-code)"
          } > pr-body.md
          gh pr create --base main --head "$BR" --title "주간 분석 $DAY" --body-file pr-body.md
