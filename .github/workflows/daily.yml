# 매일 아침(한국 시간 6~10시) 매시 정각에 가격을 수집하고 data/ 를 커밋한다.
# 쿠팡 API 호출 한도 때문에 한 번에 일부씩 나눠 수집한다. 오늘 이미 수집한 상품은 건너뛴다.
# 커밋이 올라가면 Cloudflare Pages 가 자동으로 사이트를 다시 만든다.
# 쿠팡 API 키(Secrets)가 없으면 수집 없이 끝난다.
name: daily-collect

on:
  schedule:
    - cron: '0 21,22,23,0,1 * * *' # UTC → KST 06~10시
  workflow_dispatch: {}            # Actions 탭에서 수동 실행 가능

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 가격 수집
        env:
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
        run: node src/collect.mjs
      - name: 수집 결과 커밋
        run: |
          git config user.name "golf-price-bot"
          git config user.email "golf-price-bot@users.noreply.github.com"
          mkdir -p data
          git add data
          git diff --cached --quiet || git commit -m "가격 수집 $(TZ=Asia/Seoul date +%F)"
          git push
