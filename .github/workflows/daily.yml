# 매일 한국 시간 23시: 데이터 점검 → 점검 이슈 갱신 → 기준가 재계산 → 빌드(콘텐츠 날짜·사이트맵·URL 보호) → 배포 → IndexNow
# - AI 를 쓰지 않는다. 쿠팡 페이지·링크(link.coupang.com)에 요청을 보내지 않는다.
# - 점검 결과는 'daily-check' 라벨의 이슈 하나에 매일 덮어쓴다(새 이슈를 만들지 않음). 점검 문제는 배포를 막지 않는다.
# - 쿠팡 링크가 있는 상품의 판매가·확인일은 쿠팡 파트너스 공식 API(src/prices/coupang-refresh.mjs)로 매일 전 상품을 4초 간격으로 갱신한다(config/picks.json, 같은 상품으로 확신할 때만). 그 밖의 가격은 prices.csv → node src/prices/import.mjs.
# - 매일 빈 커밋을 올려 사이트를 다시 만든다(확인한 지 14일 지난 가격 숨기기 반영). 가격만 바뀐 페이지는 '마지막 업데이트'·lastmod·IndexNow 대상이 아니다.
name: daily-check

on:
  schedule:
    - cron: '5 14 * * *' # UTC 14:05 = 한국 시간 23:05
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-check
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://choicegolf.unclepony.com
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 쿠팡 파트너스 API로 판매가·확인일 갱신 (매일 전 상품, 호출 간격 4초, 실패해도 배포 계속)
        continue-on-error: true
        timeout-minutes: 60
        env:
          COUPANG_PT_API_KEY: ${{ secrets.COUPANG_PT_API_KEY }}
          COUPANG_PT_API_SECRET_KEY: ${{ secrets.COUPANG_PT_API_SECRET_KEY }}
        run: node src/prices/coupang-refresh.mjs --gap 4

      - name: 데이터 점검 → 이슈 하나에 갱신
        continue-on-error: true
        run: |
          node src/check.mjs --out check.md > /dev/null
          gh label create daily-check --color BFD4F2 --description "매일 데이터 점검 (자동)" --force
          NUM=$(gh issue list --label daily-check --state open --json number --jq '.[0].number')
          if [ -n "$NUM" ]; then
            gh issue edit "$NUM" --title "데이터 점검 (매일 자동 갱신)" --body-file check.md
          else
            gh issue create --title "데이터 점검 (매일 자동 갱신)" --label daily-check --body-file check.md
          fi

      - name: 기준가 재계산 (평소 10% 이상 변동만, 월요일 주간 정기)
        run: |
          if [ "$(TZ=Asia/Seoul date +%u)" = "1" ]; then node src/rebaseline.mjs --weekly; else node src/rebaseline.mjs; fi

      - name: 방문·유입·쿠팡 클릭 통계 저장 (셀프 개선 분석 자료, ADMIN_PASS 없으면 건너뜀)
        continue-on-error: true
        env:
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
        run: node src/stats-save.mjs

      - name: 원/엔 환율 갱신 (/jp 섹션, ECB 기준환율 — 실패하면 기존 값으로 빌드)
        continue-on-error: true
        run: node src/jp-fx.mjs

      - name: 빌드 (콘텐츠 날짜·사이트맵·URL 301 보호 검사)
        run: node src/build.mjs

      - name: 화면 점검 (PC·휴대폰 폭 가로 스크롤·깨진 이미지·글자 넘침·빈 본문·스크립트 오류) → 문제가 있으면 운영 보고 페이지에 오류로 보고
        continue-on-error: true
        env:
          OPS_URL: ${{ secrets.OPS_URL }}
          OPS_KEY: ${{ secrets.OPS_KEY }}
        run: |
          CHROME=$(command -v google-chrome || command -v chromium) node src/qa-visual.mjs --out qa-visual.md
          n=$(grep -c '^- ' qa-visual.md || true)
          if [ "$n" != "0" ] && [ -n "$OPS_URL" ]; then
            node -e "fetch(process.env.OPS_URL,{method:'POST',headers:{'content-type':'application/json','x-ops-key':process.env.OPS_KEY},body:JSON.stringify({site:'golf-price',kind:'error',title:'화면 점검 문제 '+process.argv[1]+'건',body:require('fs').readFileSync('qa-visual.md','utf8').slice(0,6000),source:'daily-check 화면 점검'})}).then(r=>console.log('ops',r.status))" "$n"
          fi
          rm -f qa-visual.md

      - name: 커밋·배포
        run: |
          git config user.name "golf-price-bot"
          git config user.email "golf-price-bot@users.noreply.github.com"
          mkdir -p data
          git add data config
          git commit --allow-empty -m "매일 갱신 $(TZ=Asia/Seoul date +%F)"
          git pull --rebase
          git push

      - name: IndexNow·구글 사이트맵 알림 (콘텐츠가 바뀐·새·삭제된 페이지가 있을 때만, 배포 5분 뒤)
        env:
          GSC_SERVICE_ACCOUNT: ${{ secrets.GSC_SERVICE_ACCOUNT }}
          GSC_SITE: ${{ secrets.GSC_SITE }}
          GSC_REFRESH_TOKEN: ${{ secrets.GSC_REFRESH_TOKEN }}
          GSC_OAUTH_CLIENT_ID: ${{ secrets.GSC_OAUTH_CLIENT_ID }}
          GSC_OAUTH_CLIENT_SECRET: ${{ secrets.GSC_OAUTH_CLIENT_SECRET }}
        run: |
          sleep 300
          if [ "$(node -e 'console.log((require("./config/content-state.json").pending||[]).length)')" != "0" ]; then
            node src/gsc-sitemap.mjs || echo "구글 사이트맵 제출 실패 (배포에는 영향 없음)"
          fi
          node src/indexnow.mjs
          git add config/content-state.json
          git diff --cached --quiet || git commit -m "IndexNow 전송 $(TZ=Asia/Seoul date +%F) [skip ci]"
          git pull --rebase
          git push
