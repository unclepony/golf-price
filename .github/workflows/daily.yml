# 매시간 가격을 일부씩 수집해 data/ 에 쌓고, 하루 한 번만 사이트를 다시 만든다.
# - 쿠팡 API 호출 한도 때문에 한 번에 COUPANG_MAX_PER_RUN 개씩(기본 9개) 나눠 수집한다. 오늘 이미 수집한 상품은 건너뛴다.
# - 매시간 커밋에는 [skip ci] 를 붙여 Cloudflare Pages 빌드를 건너뛰고(무료 빌드 한도 보호),
#   한국 시간 23시 실행에서만 일반 커밋(필요하면 빈 커밋)을 올려 하루 한 번 사이트를 다시 만든다.
# - 쿠팡 API 키(Secrets)가 없으면 수집 없이 끝나고, 23시의 하루 한 번 재빌드만 한다(가격 확인 날짜 표시 갱신).
name: daily-collect

on:
  schedule:
    - cron: '5 * * * *' # 매시 5분
  workflow_dispatch: {}  # Actions 탭에서 수동 실행 가능

permissions:
  contents: write

concurrency:
  group: daily-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 가격 수집
        env:
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
        run: node src/collect.mjs
      - name: 수집 결과 커밋
        run: |
          git config user.name "golf-price-bot"
          git config user.email "golf-price-bot@users.noreply.github.com"
          mkdir -p data
          git add data
          HOUR=$(TZ=Asia/Seoul date +%H)
          DAY=$(TZ=Asia/Seoul date +%F)
          if [ "$HOUR" = "23" ]; then
            git commit --allow-empty -m "가격 수집 $DAY (하루 1회 사이트 갱신)"
          else
            git diff --cached --quiet || git commit -m "가격 수집 $DAY ${HOUR}시 [skip ci]"
          fi
          git pull --rebase
          git push
