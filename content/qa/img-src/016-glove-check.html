<div class="row">
 <div class="c"><span class="n">1 사이즈</span><b>딱 맞게</b><span>손가락 끝이 남지 않고<br>손바닥이 들뜨지 않게</span></div>

</div>

 <div class="c"><span class="n">3 끼는 손</span><b>보통 한 손</b><span>오른손잡이는 왼손에<br>추운 날은 양손도</span></div>

</div>

 <div class="c"><span class="n">처음 살 때</span><b>한 장만 사서 맞춰 보기</b><span>브랜드마다 사이즈가 조금씩 다르니 맞는 크기를 확인한 뒤 더 사기</span></div>
</div>
