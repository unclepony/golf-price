<div class="row">
 <div class="c"><span class="n">지금</span><b>3번 · 4번 아이언</b><span>공이 잘 뜨지 않고<br>정확히 맞히기 어려움</span></div>
 <div class="c"><span class="n">바꾸기</span><b>같은 거리 유틸리티</b><span>보통 1~2개<br>로프트가 겹치지 않게</span></div>
</div>

 <div class="c"><span class="n">지금</span><b>3번 우드</b><span>더 멀리 가지만<br>띄우기 어려움</span></div>
 <div class="c"><span class="n">바꾸기</span><b>5번(18도) · 7번</b><span>덜 가는 대신<br>페어웨이에서 치기 쉬움</span></div>
</div>

 <div class="c"><span class="n">한 번에 다 바꾸지 않기</span><b>가장 불편한 클럽부터 하나씩</b><span>1~2년 사이 모델은 성능 차이가 크지 않아 직전 모델도 좋은 선택</span></div>
