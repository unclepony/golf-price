<div class="k">초이스골프 · 초보 Q&amp;A</div>
<h1>우드, 몇 개 넣을까?</h1>
<div class="row">
 <div class="c"><span class="n">개수</span><b>보통 1~2개</b><span>3번+유틸리티<br>또는 3번+5번</span></div>
 <div class="c"><span class="n">초보</span><b>5번(18°)부터</b><span>3번은 멀리 가지만<br>띄우기 어려움</span></div>
</div>
<div class="row">
 <div class="c"><span class="n">여성</span><b>5번·7번 2개</b><span>처음엔 18~22°<br>L 샤프트가 기본</span></div>
 <div class="c"><span class="n">간격</span><b>로프트 겹치지 않게</b><span>드라이버와 너무<br>멀지도 가깝지도 않게</span></div>
</div>
<div class="row opt">
 <div class="c"><span class="n">남는 자리</span><b>유틸리티로 채우기</b><span>쓸어 치면 우드, 내려 치면 유틸리티 · 롱아이언이 어렵다면 9번 우드도</span></div>
</div>
</div>
