<div class="k">초이스골프 · 초보 Q&amp;A</div>
<h1>4번 유틸리티, 무엇부터 볼까?</h1>
<div class="row">
 <div class="c"><span class="n">4번 아이언이 안 뜬다면</span><b>유틸리티로 교체</b><span>같은 거리를<br>더 쉽게 띄움</span></div>
 <div class="c"><span class="n">번호보다 각도</span><b>같은 4번도 19~22°</b><span>판매 페이지에서<br>로프트 꼭 확인</span></div>
</div>
<div class="row">
 <div class="c"><span class="n">로프트 간격</span><b>우드와 아이언 사이</b><span>겹치지 않게<br>3~4도 간격으로</span></div>
 <div class="c"><span class="n">초보</span><b>우드형·관용형</b><span>샤프트는 R·SR<br>부드러운 쪽부터</span></div>
</div>
<div class="row opt">
 <div class="c"><span class="n">살 때</span><b>세트 구성부터 확인</b><span>처음 사는 세트에 이미 들어 있는 경우가 많음 · 여성은 22~27° 경량부터</span></div>
</div>
</div>
